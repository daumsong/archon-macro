<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Archon 원격 제어</title>
<style>
  :root { --bg:#12151b; --card:#1b1f27; --line:#2a3140; --fg:#e8ecf2; --muted:#8b93a3;
          --accent:#4a9eff; --green:#2ec76b; --red:#e05656; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,'맑은 고딕',system-ui,sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:8px 0 20px; text-align:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:14px; }
  label { display:block; color:var(--muted); font-size:12px; margin-bottom:6px; }
  input { width:100%; padding:14px; font-size:18px; letter-spacing:2px; text-align:center;
          background:#0e1116; color:var(--fg); border:1px solid var(--line); border-radius:10px; }
  button { width:100%; padding:15px; font-size:16px; font-weight:600; border:0; border-radius:10px;
           color:#fff; background:var(--accent); cursor:pointer; margin-top:10px; }
  button:active { opacity:.8; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.ghost { background:#2a3140; }
  button.green { background:var(--green); }
  button.red { background:var(--red); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid button { margin-top:0; }
  .fkeys { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .fkeys button { margin-top:0; padding:13px 0; background:#2a3140; font-size:15px; }
  .status { display:flex; align-items:center; gap:10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; flex:0 0 auto; }
  .dot.on { background:var(--green); box-shadow:0 0 8px var(--green); }
  .dot.off { background:var(--red); }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .hidden { display:none; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#000; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px;
           opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:.92; }
  .bar { height:8px; background:#0e1116; border-radius:5px; overflow:hidden; margin-top:4px; }
  .bar > i { display:block; height:100%; }
  #shotImg { cursor:zoom-in; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:1000;
              display:none; overflow:auto; -webkit-overflow-scrolling:touch; }
  .lightbox.show { display:block; }
  .lightbox img { display:block; width:100%; height:auto; }
  .lightbox .lbclose { position:fixed; top:10px; right:14px; color:#fff; font-size:30px;
                       line-height:1; z-index:1001; background:rgba(0,0,0,.4); border-radius:50%;
                       width:44px; height:44px; text-align:center; }
  .lightbox .lbhint { position:fixed; bottom:14px; left:0; right:0; text-align:center;
                      color:#bbb; font-size:12px; z-index:1001; pointer-events:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 Archon 원격 제어</h1>

  <!-- 1) 코드 입력 -->
  <div id="loginCard" class="card">
    <label>원격 코드 (아콘 화면에 표시된 코드)</label>
    <input id="codeInput" inputmode="text" autocapitalize="characters" placeholder="예: A7K9P2" maxlength="10">
    <button id="connectBtn">연결</button>
    <p class="muted" style="margin:12px 0 0">아콘 프로그램의 <b>원격 제어</b>에서 표시된 코드를 입력하세요.</p>
  </div>

  <!-- 2) 제어판 -->
  <div id="panel" class="hidden">
    <div class="card">
      <div class="status">
        <span id="dot" class="dot"></span>
        <div style="flex:1">
          <div id="stateText" style="font-weight:600">상태 확인 중…</div>
          <div id="seenText" class="muted">—</div>
        </div>
        <button class="ghost" style="width:auto;padding:8px 12px;margin:0" id="logoutBtn">해제</button>
      </div>
      <div class="row" style="margin-top:12px"><span class="muted">HP</span><span id="hpText">—</span></div>
      <div class="bar"><i id="hpBar" style="width:0;background:var(--red)"></i></div>
      <div class="row"><span class="muted">MP</span><span id="mpText">—</span></div>
      <div class="bar"><i id="mpBar" style="width:0;background:var(--accent)"></i></div>
    </div>

    <div class="card">
      <label>자동사냥</label>
      <div class="grid">
        <button class="green" data-cmd="hunt_on">▶ 시작</button>
        <button class="red" data-cmd="hunt_off">■ 중단</button>
      </div>
      <button class="ghost" data-cmd="move_hunt">🚚 이동 후 사냥</button>
    </div>

    <div class="card">
      <label>게임 화면</label>
      <button class="ghost" id="shotBtn">📷 화면 보기 (1장 캡쳐)</button>
      <img id="shotImg" style="width:100%;border-radius:8px;margin-top:10px;display:none" alt="">
      <div id="shotMsg" class="muted" style="margin-top:6px"></div>
    </div>

    <div class="card">
      <label>키 전송 (F1~F12 · 기계식)</label>
      <div class="fkeys" id="fkeys"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="lightbox" class="lightbox">
  <span class="lbclose">✕</span>
  <img id="lbImg" alt="">
  <div class="lbhint">한 번 탭: 확대/축소 · ✕ 또는 배경 탭: 닫기</div>
</div>

<script>
// ===================== 설정 (아콘과 동일하게) =====================
// Firebase Realtime Database URL — 프로젝트 만든 뒤 여기에 붙여넣기
const DB_URL = "https://archon-remote-default-rtdb.asia-southeast1.firebasedatabase.app";
// ================================================================

let CODE = null, pollTimer = null, kaTimer = null;

const $ = s => document.querySelector(s);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }

function roomUrl(path){ return `${DB_URL}/rooms/${CODE}/${path}.json`; }

async function sendCmd(cmd){
  if(!CODE) return;
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  try{
    await fetch(roomUrl("cmd"), { method:"PUT",
      body: JSON.stringify({ id, cmd, ts: Date.now() }) });
    toast("전송: " + cmd);
  }catch(e){ toast("전송 실패 (네트워크)"); }
}

async function pollStatus(){
  if(!CODE) return;
  try{
    const r = await fetch(roomUrl("status"));
    const s = await r.json();
    renderStatus(s);
  }catch(e){ renderStatus(null); }
}

function fmtAge(ts){
  if(!ts) return "—";
  const sec = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(sec < 60) return sec + "초 전";
  return Math.round(sec/60) + "분 전";
}

let pending = {};  // 방금 누른 명령 → 잠시 그 버튼 비활성 (중복 클릭 방지)

function renderStatus(s){
  const online = s && s.ts && (Date.now()-s.ts) < 15000; // 15초 내 갱신 = 온라인
  $("#dot").className = "dot " + (online ? "on" : "off");
  if(!s){ $("#stateText").textContent = "응답 없음"; $("#seenText").textContent="—"; setButtons(null,false); return; }
  // 신형식(불리언) + 구형식(state 문자열) 둘 다 호환
  const hunt = !!s.hunt || s.state==='hunting';
  const pf   = !!s.pathfind || s.state==='pathfind';
  const rs   = !!s.restock || s.state==='restock';
  const busy = hunt || pf || rs;   // 자동사냥 계열 동작 중
  // 상태 라벨 (우선순위: 보급/길찾기 > 자동사냥 > 대기)
  let label;
  if(rs) label="🟡 보급/이동 중";
  else if(pf) label="🟡 길찾기(이동) 중";
  else if(hunt) label="🟢 자동사냥 작동중";
  else label="⚫ 대기";
  $("#stateText").textContent = (online?"":"⚠ 오프라인 · ") + label;
  $("#seenText").textContent = "최근 갱신 " + fmtAge(s.ts);
  const hp = (s.hp ?? -1), mp = (s.mp ?? -1);
  $("#hpText").textContent = hp>=0 ? hp+"%" : "—";
  $("#mpText").textContent = mp>=0 ? mp+"%" : "—";
  $("#hpBar").style.width = (hp>=0?hp:0)+"%";
  $("#mpBar").style.width = (mp>=0?mp:0)+"%";
  setButtons(busy, online);
}

function setButtons(busy, online){
  const onBtn = document.querySelector('[data-cmd="hunt_on"]');
  const offBtn = document.querySelector('[data-cmd="hunt_off"]');
  const mvBtn = document.querySelector('[data-cmd="move_hunt"]');
  const pOn = pending['hunt_on'] && (Date.now()-pending['hunt_on'] < 6000);
  const pMv = pending['move_hunt'] && (Date.now()-pending['move_hunt'] < 6000);
  const pOff = pending['hunt_off'] && (Date.now()-pending['hunt_off'] < 6000);
  if(onBtn){
    onBtn.textContent = busy ? "🟢 작동중" : "▶ 시작";
    onBtn.disabled = !online || busy || !!pOn || !!pMv;
  }
  if(mvBtn){ mvBtn.disabled = !online || busy || !!pOn || !!pMv; }
  if(offBtn){
    offBtn.textContent = busy ? "■ 중단" : "중단됨";
    offBtn.disabled = !online || !busy || !!pOff;
  }
}

function connect(code){
  CODE = code.trim().toUpperCase();
  if(!CODE){ toast("코드를 입력하세요"); return; }
  localStorage.setItem("archon_code", CODE);
  $("#loginCard").classList.add("hidden");
  $("#panel").classList.remove("hidden");
  pollStatus();
  clearInterval(pollTimer); pollTimer = setInterval(pollStatus, 2500);
  sendCmd("status"); // 연결 즉시 상태 요청 (앱 빠른폴링 진입)
  // keepalive — 연결 중엔 15초마다 신호 보내 앱이 빠른 폴링 유지 (F키 즉각 반응)
  clearInterval(kaTimer); kaTimer = setInterval(()=>{ if(CODE) sendCmd("status"); }, 15000);
}

function logout(){
  CODE=null; clearInterval(pollTimer); clearInterval(kaTimer); localStorage.removeItem("archon_code");
  $("#panel").classList.add("hidden"); $("#loginCard").classList.remove("hidden");
}

// 이벤트
$("#connectBtn").addEventListener("click", ()=>connect($("#codeInput").value));
$("#codeInput").addEventListener("keydown", e=>{ if(e.key==="Enter") connect(e.target.value); });
$("#logoutBtn").addEventListener("click", logout);
document.querySelectorAll("[data-cmd]").forEach(b=>
  b.addEventListener("click", ()=>{
    if(b.disabled) return;
    const c = b.dataset.cmd;
    if(c!=="status"){ pending[c] = Date.now(); b.disabled = true; }
    sendCmd(c);
    setTimeout(pollStatus, 1000);
    setTimeout(pollStatus, 2800);   // 상태 반영되면 버튼 자동 갱신
  }));

// 화면 보기 (온디맨드 캡쳐)
let shotReqTs = 0, shotTimer = null;
const SHOT_TEXT = "📷 화면 보기 (1장 캡쳐)";
$("#shotBtn").addEventListener("click", async ()=>{
  if(!CODE) return;
  const btn = $("#shotBtn");
  if(btn.disabled) return;
  // 오남용 방지 — 클릭 후 10초 쿨다운
  btn.disabled = true;
  let left = 10;
  btn.textContent = `📷 대기 ${left}초`;
  const cd = setInterval(()=>{
    left--;
    if(left<=0){ clearInterval(cd); btn.disabled=false; btn.textContent=SHOT_TEXT; }
    else btn.textContent = `📷 대기 ${left}초`;
  }, 1000);
  shotReqTs = Date.now();
  $("#shotMsg").textContent = "캡쳐 요청 중…";
  await sendCmd("shot");
  clearInterval(shotTimer);
  let tries = 0;
  // 최적화: 작은 ts만 반복 조회 → 완료되면 이미지 딱 1번만 다운로드 (데이터 절약)
  shotTimer = setInterval(async ()=>{
    tries++;
    try{
      const rt = await fetch(roomUrl("shot/ts"));   // ~13바이트
      const ts = await rt.json();
      if(ts && ts >= shotReqTs){
        clearInterval(shotTimer);
        const ri = await fetch(roomUrl("shot/img")); // 이미지 1번만 (~50KB)
        const img = await ri.json();
        if(img){
          $("#shotImg").src = "data:image/jpeg;base64," + img;
          $("#shotImg").style.display = "block";
          $("#shotMsg").textContent = "캡쳐 " + new Date().toLocaleTimeString();
        } else {
          $("#shotMsg").textContent = "게임창을 찾을 수 없음";
        }
      }
    }catch(e){}
    if(tries > 15){ clearInterval(shotTimer); $("#shotMsg").textContent = "응답 없음 (아콘 실행/원격 켜짐 확인)"; }
  }, 700);
});

// 캡쳐 이미지 확대 (라이트박스, 모바일 최적화)
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
let lbZoom = false;
$("#shotImg").addEventListener("click", ()=>{
  if(!$("#shotImg").src) return;
  lbImg.src = $("#shotImg").src;
  lbZoom = false; lbImg.style.width = "100%";
  lb.classList.add("show");
});
function lbClose(){ lb.classList.remove("show"); lb.scrollTop = 0; }
document.querySelector(".lbclose").addEventListener("click", lbClose);
lbImg.addEventListener("click", (e)=>{
  e.stopPropagation();
  lbZoom = !lbZoom;
  lbImg.style.width = lbZoom ? "220%" : "100%";  // 탭하면 확대(가로 스크롤)
  lbImg.style.cursor = lbZoom ? "zoom-out" : "zoom-in";
});
lb.addEventListener("click", lbClose);  // 배경 탭 = 닫기

// F1~F12 키 전송 (각 버튼 1초 쿨다운 — 오남용 방지)
(function(){
  const fk = document.getElementById("fkeys");
  for(let i=1;i<=12;i++){
    const b = document.createElement("button");
    b.textContent = "F"+i;
    b.addEventListener("click", ()=>{
      if(b.disabled || !CODE) return;
      sendCmd("key_F"+i);
      b.disabled = true;
      setTimeout(()=>{ b.disabled = false; }, 1000);
    });
    fk.appendChild(b);
  }
})();

// 탭 복귀(화면 켜짐/앱 전환 복귀) 시 즉시 재폴링 — 모바일 백그라운드로 멈췄던 것 복구
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && CODE){
    pollStatus();
    sendCmd("status");  // 앱 빠른폴링 재진입
  }
});
window.addEventListener("focus", ()=>{ if(CODE){ pollStatus(); } });

// 자동 재연결 (마지막 코드 기억)
const saved = localStorage.getItem("archon_code");
if(saved && DB_URL && !DB_URL.includes("__")){ $("#codeInput").value = saved; connect(saved); }
if(DB_URL.includes("__")){ toast("설정 필요: DB_URL 미입력"); }
</script>
</body>
</html>
