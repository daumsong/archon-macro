<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archon Macro - 1:1 문의</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3CTDW86D13"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-3CTDW86D13');</script>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: '맑은 고딕', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #161b22; border-bottom: 1px solid #30363d; }
        .nav a { color: #e0e0e0; text-decoration: none; font-weight: bold; font-size: 18px; }
        .nav a:hover { color: #2ea043; }
        .nav-right { display: flex; gap: 15px; align-items: center; }
        .nav-right span { color: #8b949e; font-size: 14px; }
        .btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s; }
        .btn-green { background: #238636; color: #fff; }
        .btn-green:hover { background: #2ea043; }
        .btn-red { background: #da3633; color: #fff; }
        .btn-red:hover { background: #f85149; }
        .btn-blue { background: #1f6feb; color: #fff; }
        .btn-blue:hover { background: #388bfd; }
        .btn-gray { background: #30363d; color: #e0e0e0; }
        .btn-gray:hover { background: #484f58; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        .auth-box { max-width: 400px; margin: 60px auto; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; }
        .auth-box h2 { text-align: center; margin-bottom: 25px; color: #fff; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #8b949e; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e0e0e0; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #1f6feb; }
        .form-group textarea { height: 150px; resize: vertical; }
        .msg { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; display: none; }
        .msg-error { background: #3d1214; border: 1px solid #da3633; color: #f85149; }
        .msg-success { background: #12261e; border: 1px solid #238636; color: #2ea043; }
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .board-header h2 { color: #fff; font-size: 24px; }
        .inquiry-list { display: flex; flex-direction: column; gap: 10px; }
        .inquiry-item { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px 20px; cursor: pointer; transition: all 0.3s; }
        .inquiry-item:hover { border-color: #1f6feb; }
        .inquiry-title { font-size: 16px; color: #fff; margin-bottom: 5px; }
        .inquiry-meta { font-size: 13px; color: #8b949e; }
        .inquiry-status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .status-waiting { background: #3d2e00; color: #d29922; }
        .status-replied { background: #12261e; color: #2ea043; }
        .empty { text-align: center; color: #484f58; padding: 40px; font-size: 16px; }
        .detail-box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .detail-title { font-size: 20px; color: #fff; margin-bottom: 10px; }
        .detail-content { color: #c9d1d9; line-height: 1.7; white-space: pre-wrap; margin: 15px 0; padding: 15px; background: #0d1117; border-radius: 6px; }
        .reply-box { background: #12261e; border: 1px solid #238636; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .reply-box h4 { color: #2ea043; margin-bottom: 8px; }
        .reply-box p { color: #c9d1d9; line-height: 1.6; white-space: pre-wrap; }
        .back-link { color: #1f6feb; cursor: pointer; font-size: 14px; margin-bottom: 15px; display: inline-block; }
        .admin-reply { margin-top: 15px; }
        .small { font-size: 12px; color: #6e7681; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/">Archon Macro</a>
    <div class="nav-right" id="navRight">
        <a href="/board/">1:1 문의</a>
    </div>
</nav>

<div class="container">
    <!-- 이메일 입력 (간이 인증) -->
    <div id="authSection" style="display:none;">
        <div class="auth-box">
            <h2>이메일 인증</h2>
            <div class="msg" id="authMsg"></div>
            <div class="form-group">
                <label>이메일 (본인 글 조회 / 새 문의 작성에 사용)</label>
                <input type="email" id="authEmail" placeholder="example@gmail.com">
            </div>
            <button class="btn btn-green" style="width:100%; margin-bottom:10px;" onclick="loginUser()">계속</button>
            <p class="small" style="text-align:center;">관리자는 동일 입력란에 관리자 토큰을 입력하면 전체 문의를 볼 수 있습니다.</p>
        </div>
    </div>

    <!-- 문의 목록 -->
    <div id="listSection" style="display:none;">
        <div class="board-header">
            <h2>1:1 문의</h2>
            <div>
                <button class="btn btn-green" onclick="showWrite()">문의하기</button>
                <button class="btn btn-gray" onclick="logout()">로그아웃</button>
            </div>
        </div>
        <div class="inquiry-list" id="inquiryList"></div>
    </div>

    <!-- 문의 작성 -->
    <div id="writeSection" style="display:none;">
        <div class="detail-box">
            <h2 style="margin-bottom:20px;">문의 작성</h2>
            <div class="msg" id="writeMsg"></div>
            <div class="form-group">
                <label>제목</label>
                <input type="text" id="writeTitle" placeholder="문의 제목을 입력하세요" maxlength="200">
            </div>
            <div class="form-group">
                <label>내용</label>
                <textarea id="writeContent" placeholder="문의 내용을 상세히 작성해 주세요"></textarea>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn btn-gray" onclick="showList()">취소</button>
                <button class="btn btn-green" onclick="submitInquiry()">제출</button>
            </div>
        </div>
    </div>

    <!-- 문의 상세 -->
    <div id="detailSection" style="display:none;">
        <a class="back-link" onclick="showList()">← 목록으로</a>
        <div class="detail-box">
            <div class="inquiry-meta" id="detailMeta"></div>
            <h2 class="detail-title" id="detailTitle"></h2>
            <div class="detail-content" id="detailContent"></div>
            <div id="detailReplyBox"></div>
            <div class="admin-reply" id="adminReplyForm" style="display:none;">
                <h4 style="color:#1f6feb; margin:15px 0 8px;">관리자 답변 작성</h4>
                <textarea id="adminReplyText" style="width:100%; padding:10px; background:#0d1117; border:1px solid #30363d; border-radius:6px; color:#e0e0e0; height:120px;"></textarea>
                <button class="btn btn-blue" style="margin-top:10px;" onclick="submitReply()">답변 등록</button>
            </div>
        </div>
    </div>
</div>

<script>
// ↓↓↓ 사용자가 직접 채워야 할 값 ↓↓↓
const SCRIPT_URL = 'https://script.google.com/macros/s/REPLACE_WITH_YOUR_DEPLOYMENT_ID/exec';
// ↑↑↑ Apps Script 배포 후 받은 웹앱 URL을 여기에 붙여넣기 ↑↑↑

// 사용자 상태 (localStorage에 저장)
let currentEmail = localStorage.getItem('archon_inquiry_email') || '';
let adminToken   = localStorage.getItem('archon_inquiry_admin_token') || '';
let isAdmin      = !!adminToken;
let currentInquiryId = null;

function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function maskEmail(e) {
    if (!e || !e.includes('@')) return '****';
    const [a, b] = e.split('@');
    return (a.length > 2 ? a.slice(0,2)+'****' : '****') + '@' + b;
}
function showMsg(elId, text, type) {
    const m = document.getElementById(elId);
    m.textContent = text;
    m.className = 'msg msg-' + type;
    m.style.display = 'block';
}
function hideAll() {
    ['authSection','listSection','writeSection','detailSection'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    });
}

async function api(params) {
    if (SCRIPT_URL.includes('REPLACE_WITH')) {
        alert('Apps Script URL이 설정되지 않았습니다. board/index.html의 SCRIPT_URL을 수정해 주세요.');
        return { ok: false, error: 'no script url' };
    }
    try {
        const r = await fetch(SCRIPT_URL, {
            method: 'POST',
            // Apps Script는 application/json + CORS preflight를 차단하므로
            // text/plain으로 보내야 preflight 없이 전달됨 (서버측 JSON.parse)
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(params),
        });
        return await r.json();
    } catch (err) {
        return { ok: false, error: String(err) };
    }
}

function loginUser() {
    const v = document.getElementById('authEmail').value.trim();
    if (!v) { showMsg('authMsg', '이메일 또는 관리자 토큰을 입력하세요.', 'error'); return; }
    if (v.includes('@')) {
        currentEmail = v.toLowerCase();
        adminToken = '';
        isAdmin = false;
        localStorage.setItem('archon_inquiry_email', currentEmail);
        localStorage.removeItem('archon_inquiry_admin_token');
    } else {
        // 관리자 토큰으로 간주
        adminToken = v;
        currentEmail = '';
        isAdmin = true;
        localStorage.setItem('archon_inquiry_admin_token', adminToken);
        localStorage.removeItem('archon_inquiry_email');
    }
    showList();
}

function logout() {
    currentEmail = '';
    adminToken = '';
    isAdmin = false;
    localStorage.removeItem('archon_inquiry_email');
    localStorage.removeItem('archon_inquiry_admin_token');
    showAuth();
}

function showAuth() {
    hideAll();
    document.getElementById('authSection').style.display = 'block';
}

async function showList() {
    if (!currentEmail && !isAdmin) { showAuth(); return; }
    hideAll();
    document.getElementById('listSection').style.display = 'block';
    const listEl = document.getElementById('inquiryList');
    listEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    const params = isAdmin ? { action: 'list', token: adminToken } : { action: 'list', email: currentEmail };
    const res = await api(params);
    if (!res.ok) {
        listEl.innerHTML = `<div class="empty">목록 조회 실패: ${escapeHtml(res.error || '알 수 없음')}</div>`;
        return;
    }
    const items = res.items || [];
    if (items.length === 0) {
        listEl.innerHTML = '<div class="empty">문의 내역이 없습니다.</div>';
        return;
    }
    listEl.innerHTML = items.map(it => `
        <div class="inquiry-item" onclick="showDetail('${escapeHtml(it.id)}')">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="inquiry-title">${escapeHtml(it.title)}</div>
                <span class="inquiry-status ${it.status === '답변완료' ? 'status-replied' : 'status-waiting'}">${escapeHtml(it.status)}</span>
            </div>
            <div class="inquiry-meta">
                ${isAdmin ? escapeHtml(it.user_email) : maskEmail(it.user_email)} | ${new Date(it.created_at).toLocaleDateString('ko-KR')}
            </div>
        </div>
    `).join('');
}

function showWrite() {
    if (isAdmin) { alert('관리자 모드에서는 문의를 작성할 수 없습니다. 일반 이메일로 다시 로그인하세요.'); return; }
    hideAll();
    document.getElementById('writeSection').style.display = 'block';
    document.getElementById('writeTitle').value = '';
    document.getElementById('writeContent').value = '';
    document.getElementById('writeMsg').style.display = 'none';
}

async function submitInquiry() {
    const title = document.getElementById('writeTitle').value.trim();
    const content = document.getElementById('writeContent').value.trim();
    if (!title || !content) { showMsg('writeMsg', '제목과 내용을 모두 입력하세요.', 'error'); return; }
    const res = await api({ action: 'create', email: currentEmail, title, content });
    if (!res.ok) { showMsg('writeMsg', '제출 실패: ' + (res.error || ''), 'error'); return; }
    showList();
}

async function showDetail(id) {
    hideAll();
    document.getElementById('detailSection').style.display = 'block';
    currentInquiryId = id;
    const params = isAdmin
        ? { action: 'get', id, token: adminToken }
        : { action: 'get', id, email: currentEmail };
    const res = await api(params);
    if (!res.ok) { alert('상세 조회 실패: ' + (res.error || '')); showList(); return; }
    const it = res.item;
    document.getElementById('detailMeta').textContent =
        `${isAdmin ? it.user_email : maskEmail(it.user_email)} | ${new Date(it.created_at).toLocaleDateString('ko-KR')} | ${it.status}`;
    document.getElementById('detailTitle').textContent = it.title;
    document.getElementById('detailContent').textContent = it.content;
    const rb = document.getElementById('detailReplyBox');
    if (it.admin_reply) {
        rb.innerHTML = `
            <div class="reply-box">
                <h4>관리자 답변 ${it.replied_at ? `<span class="small">(${new Date(it.replied_at).toLocaleDateString('ko-KR')})</span>` : ''}</h4>
                <p>${escapeHtml(it.admin_reply)}</p>
            </div>`;
    } else {
        rb.innerHTML = '';
    }
    document.getElementById('adminReplyForm').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('adminReplyText').value = it.admin_reply || '';
}

async function submitReply() {
    const reply = document.getElementById('adminReplyText').value.trim();
    if (!reply) { alert('답변 내용을 입력하세요.'); return; }
    const res = await api({ action: 'reply', id: currentInquiryId, reply, token: adminToken });
    if (!res.ok) { alert('답변 등록 실패: ' + (res.error || '')); return; }
    showDetail(currentInquiryId);
}

// 초기 진입
if (currentEmail || isAdmin) showList();
else showAuth();
</script>
</body>
</html>
